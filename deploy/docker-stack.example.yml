version: "3.8"

services:
  cloudflared:
    image: ghcr.io/your-org/cf-tunnel-agent:0.1.0
    hostname: cloudflared
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:1984/health >/dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
    networks:
      - aa_host_bridge
      - cf-net
    volumes:
      - tunnels:/temp-tunnel
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${DEPLOY_NODE}
      restart_policy:
        condition: any
        window: 5m
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
      QUICK_TUNNELS: ${QUICK_TUNNELS}
      FIXED_METRICS_PORT_BASE: "2000"
      QUICK_METRICS_PORT_BASE: "2100"
      LOG_FILE: /temp-tunnel/history.log
      MAP_FILE: /temp-tunnel/tunnels.list
      WORKER_BASE_URL: ${WORKER_BASE_URL}
      AGENT_TOKEN: ${AGENT_TOKEN}
      SWARM_NODE_NAME: ${DEPLOY_NODE}
      STACK_NAME: ${STACK_NAME}
      SERVICE_NAME: cloudflared

networks:
  aa_host_bridge:
    external: true
  cf-net:
    external: true

volumes:
  tunnels:
